# OLED Display Configuration
# Enable display and custom status screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Widget Configuration
# Disable built-in widgets to implement custom ones
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# RGB Underglow Settings
# Basic RGB configuration without external power
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Bluetooth Configuration
# Enhanced connectivity and signal strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Power Management
# Enable sleep mode for battery conservation
CONFIG_ZMK_SLEEP=y

# Display Processing Configuration
# Optimize display thread handling
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=n