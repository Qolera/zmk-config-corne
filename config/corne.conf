# Enable OLED Display and custom screen configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Disable default widgets for custom implementation
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# RGB Underglow Configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Don't require external power source
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Power saving: turn off when idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Set maximum RGB brightness
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=150

# Boost BLE signal strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable experimental connectivity features
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Enable deep sleep for battery saving
CONFIG_ZMK_SLEEP=y

# Optimize display processing
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=n