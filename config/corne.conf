# Enable OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Disable default widgets to use custom ones
# CONFIG_ZMK_WIDGET_LAYER_STATUS=n
# CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
# CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
# CONFIG_ZMK_WIDGET_WPM_STATUS=n

# RGB Underglow Configuration
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n   # Don't require external power
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y   # Turn off RGB when idle
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=150   # Maximum brightness (0-255)

# Bluetooth and Power Settings
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y   # Increase BLE transmission power
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y   # Enable experimental BLE features

# Power Management
CONFIG_ZMK_SLEEP=y   # Enable deep sleep mode

# Display Queue Management
CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=n   # Use dedicated display thread